<style>
:root{
  color-scheme:dark;
  --ink:#0d0b09; --coal:#16120e; --coal-2:#1f1914;
  --bone:#ece3d3; --dust:#9b8e7b; --dim:#5f5548;
  --mostaza:#e3a92b; --sangre:#8e2014;
  --line:rgba(236,227,211,.11);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink)}
body{color:var(--bone);font:400 16px/1.55 var(--body);padding-inline:clamp(16px,4vw,48px);padding-block:0 64px;
  background:radial-gradient(1100px 600px at 85% -10%,rgba(227,169,43,.07),transparent 60%),var(--ink)}
.wrap{max-width:1120px;margin:0 auto}
a{color:var(--mostaza)}
:focus-visible{outline:2px solid var(--mostaza);outline-offset:3px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--bone)}
.brand img{width:44px;height:44px;border-radius:50%}
.brand b{font:900 26px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand b span{color:var(--mostaza)}
nav{display:flex;gap:20px}
nav a{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);text-decoration:none}
nav a:hover{color:var(--bone)}

/* featured */
.feature{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,64px);align-items:center;padding-block:clamp(32px,6vw,72px)}
.cover{position:relative;aspect-ratio:1;max-width:100%;border-radius:3px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.9),0 0 0 1px var(--line)}
.cover .art{display:block;width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.cover.playing .art{transform:scale(1.03)}
.cover.playing 
.info{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.eyebrow .tag{color:var(--mostaza)}
h1{font:900 clamp(56px,9vw,112px)/.86 var(--display);letter-spacing:-.01em;text-transform:uppercase;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px var(--bone)}
.sub{font-size:18px;color:var(--dust);margin:0;max-width:44ch}
.sub strong{color:var(--bone);font-weight:600}

/* player */
.player{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:18px;background:var(--coal);border:1px solid var(--line);border-radius:6px}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--mostaza);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .15s ease,background .15s}
.play:hover{transform:scale(1.05)}
.play:active{transform:scale(.96)}
.play svg{width:24px;height:24px}
.wave-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.wave{position:relative;height:64px;cursor:pointer;touch-action:none}
.wave canvas{width:100%;height:100%;display:block}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dust);font-variant-numeric:tabular-nums}
.times .now{color:var(--bone)}
.specs{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--dust)}
.vol{display:flex;align-items:center;gap:10px;grid-column:1/-1;padding-top:6px;border-top:1px solid var(--line)}
.vol input{flex:1;max-width:180px;accent-color:var(--mostaza)}

/* sections */
section{padding-block:40px;border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h2{font:800 clamp(32px,4.5vw,44px)/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}

/* tracklist */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:48px 52px minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line);border-radius:4px}
.row .n{font-family:var(--mono);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.row img{width:52px;height:52px;border-radius:2px;display:block}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--dust)}
.row .d{font-family:var(--mono);font-size:13px;color:var(--dust);font-variant-numeric:tabular-nums}
.row button.mini{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--bone);cursor:pointer;display:grid;place-items:center}
.row button.mini svg{width:14px;height:14px}
.row.live{cursor:pointer}
.row.live:hover{background:var(--coal)}
.row.current{background:var(--coal)}
.row.current .n{color:var(--mostaza)}
.row.current button.mini{background:var(--mostaza);color:var(--ink);border-color:var(--mostaza)}
.row.slot{opacity:.5}
.slot-box{width:52px;height:52px;border:1px dashed var(--dim);border-radius:2px;display:grid;place-items:center;color:var(--dim);font-size:22px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-left:8px;vertical-align:middle}
.eq i{width:3px;background:var(--mostaza);animation:eq 900ms ease-in-out infinite alternate;height:4px}
.eq i:nth-child(2){animation-delay:-300ms}.eq i:nth-child(3){animation-delay:-600ms}
@keyframes eq{to{height:12px}}
.paused .eq i{animation-play-state:paused}

footer{padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:820px){
  .feature{grid-template-columns:1fr}
  .cover{max-width:460px}
}
@media (max-width:520px){
  nav{display:none}
  .row{grid-template-columns:28px 44px minmax(0,1fr) auto;gap:12px}
  .row img,.slot-box{width:44px;height:44px}
  .row .d{display:none}
  .player{padding:14px;gap:14px}
  .play{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

// Para sumar un tema: subí el MP3 a la carpeta tracks/ y agregá una entrada acá.
const TRACKS = [
  { n:1, title:"TeknoTango V12327", release:"Tango Minimal", file:"tracks/TEKNOTANGO-V12327.mp3", cover:COVER, duration:"3:56",
    peaks: [0.04, 0.04, 0.09, 0.1, 0.18, 0.1, 0.32, 0.24, 0.16, 0.26, 0.19, 0.19, 0.46, 0.2, 0.09, 0.33, 0.11, 0.2, 0.27, 0.18, 0.24, 0.16, 0.26, 0.11, 0.16, 0.15, 0.75, 0.74, 0.73, 0.75, 0.76, 0.72, 0.78, 0.78, 0.28, 0.36, 0.47, 0.67, 0.66, 0.72, 0.71, 0.7, 0.71, 0.56, 0.48, 0.41, 0.39, 0.49, 0.41, 0.47, 0.39, 0.37, 0.41, 0.34, 0.38, 0.41, 0.42, 0.59, 0.87, 0.91, 0.91, 0.88, 0.79, 0.81, 0.8, 0.79, 0.76, 0.74, 0.67, 0.67, 0.67, 0.67, 0.68, 0.48, 0.35, 0.34, 0.39, 0.4, 0.64, 0.49, 0.47, 0.27, 0.33, 0.46, 0.45, 0.49, 0.46, 0.49, 0.45, 0.3, 0.46, 0.65, 0.96, 0.93, 0.9, 0.88, 0.88, 1.0, 0.95, 0.96, 0.99, 0.94, 0.92, 0.92, 0.92, 0.87, 0.86, 0.86, 0.86, 0.83, 0.83, 0.81, 0.82, 0.71, 0.55, 0.53, 0.46, 0.41, 0.39, 0.38, 0.38, 0.43, 0.42, 0.41, 0.4, 0.61, 0.84, 0.85, 0.8, 0.79, 0.84, 0.6, 0.48, 0.51, 0.58, 0.6, 0.56, 0.28, 0.19, 0.31, 0.21, 0.14, 0.27, 0.13, 0.1, 0.07, 0.05, 0.36, 0.43, 0.23, 0.67, 0.22, 0.25, 0.18, 0.22, 0.63, 0.14, 0.02, 0.0, 0.0] }
];
const SLOTS = 0; // poné 1 o 2 si querés mostrar lugares para próximos temas

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const icoPlay = document.getElementById('icoPlay'), icoPause = document.getElementById('icoPause');
const cover = document.getElementById('cover');
const wave = document.getElementById('wave'), canvas = document.getElementById('waveCanvas');
const tNow = document.getElementById('tNow'), tDur = document.getElementById('tDur');
const list = document.getElementById('list');
let current = 0;

const fmt = s => { if(!isFinite(s)) return '0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';

function renderList(){
  list.innerHTML = '';
  TRACKS.forEach((t,i)=>{
    const li = document.createElement('li');
    const isCur = i===current, playing = isCur && !audio.paused;
    li.className = 'row live' + (isCur?' current':'') + (isCur && audio.paused?' paused':'');
    li.innerHTML = `<span class="n">${String(t.n).padStart(2,'0')}</span>
      <img src="${t.cover}" alt="">
      <div class="t"><b>${t.title}${isCur?'<span class="eq"><i></i><i></i><i></i></span>':''}</b><span>${t.release}</span></div>
      <span class="d">${t.duration}</span>
      <button class="mini" aria-label="${playing?'Pausar':'Reproducir'} ${t.title}">${playing?PAUSE:PLAY}</button>`;
    li.addEventListener('click',()=>{ if(i!==current){ load(i); audio.play(); } else toggle(); });
    list.appendChild(li);
  });
  for(let k=0;k<SLOTS;k++){
    const li = document.createElement('li');
    li.className='row slot';
    li.innerHTML = `<span class="n">${String(TRACKS.length+k+1).padStart(2,'0')}</span>
      <div class="slot-box">+</div>
      <div class="t"><b>Próximo track</b><span>Espacio de ejemplo</span></div>
      <span class="d">—:——</span><span></span>`;
    list.appendChild(li);
  }
  document.getElementById('count').textContent = TRACKS.length + (TRACKS.length===1?' tema publicado':' temas publicados');
}

function load(i){
  current = i; const t = TRACKS[i];
  audio.src = t.file;
  document.getElementById('npTitle').textContent = t.title;
  tDur.textContent = t.duration; tNow.textContent = '0:00';
  draw(0); renderList();
}
function toggle(){ audio.paused ? audio.play() : audio.pause(); }

function syncState(){
  const p = !audio.paused;
  icoPlay.toggleAttribute('hidden', p); icoPause.toggleAttribute('hidden', !p);
  playBtn.setAttribute('aria-label', p?'Pausar':'Reproducir');
  cover.classList.toggle('playing', p);
  renderList();
}

/* waveform */
function draw(progress){
  const peaks = TRACKS[current].peaks;
  const dpr = window.devicePixelRatio||1, w = wave.clientWidth, h = wave.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const n = peaks.length, gap = w/n, bw = Math.max(1, gap*0.55), mid = h/2;
  for(let i=0;i<n;i++){
    const x = i*gap, amp = Math.max(1.5, peaks[i]*(h/2-2));
    ctx.fillStyle = (i/n) < progress ? '#e3a92b' : 'rgba(236,227,211,.22)';
    ctx.fillRect(x, mid-amp, bw, amp*2);
  }
}
function seekFromEvent(e){
  const r = wave.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width));
  if(isFinite(audio.duration)) audio.currentTime = p*audio.duration;
  draw(p);
}
let dragging=false;
wave.addEventListener('pointerdown',e=>{dragging=true;wave.setPointerCapture(e.pointerId);seekFromEvent(e);});
wave.addEventListener('pointermove',e=>{ if(dragging) seekFromEvent(e); });
wave.addEventListener('pointerup',()=>dragging=false);
wave.addEventListener('keydown',e=>{
  if(!isFinite(audio.duration)) return;
  if(e.key==='ArrowRight'){audio.currentTime=Math.min(audio.duration,audio.currentTime+5);e.preventDefault();}
  if(e.key==='ArrowLeft'){audio.currentTime=Math.max(0,audio.currentTime-5);e.preventDefault();}
});

audio.addEventListener('timeupdate',()=>{
  const p = audio.duration ? audio.currentTime/audio.duration : 0;
  tNow.textContent = fmt(audio.currentTime);
  wave.setAttribute('aria-valuenow', Math.round(p*100));
  if(!dragging) draw(p);
});
audio.addEventListener('loadedmetadata',()=>{ tDur.textContent = fmt(audio.duration); });
audio.addEventListener('play',syncState);
audio.addEventListener('pause',syncState);
audio.addEventListener('ended',()=>{ if(current < TRACKS.length-1){ load(current+1); audio.play(); } });

playBtn.addEventListener('click',toggle);
document.getElementById('vol').addEventListener('input',e=>audio.volume=+e.target.value);
audio.volume = 0.9;
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && !['BUTTON','INPUT'].includes(document.activeElement.tagName) && document.activeElement!==wave){ e.preventDefault(); toggle(); }
});
window.addEventListener('resize',()=>draw(audio.duration?audio.currentTime/audio.duration:0));

load(0);
</script>
